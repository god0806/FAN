<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>114年數學會考減C加強測驗</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: '微軟正黑體', sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 800px; width: 100%; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 30px; }
        h1 { text-align: center; color: #2c3e50; }
        .progress { text-align: right; color: #7f8c8d; margin-bottom: 20px; }
        .question-box { font-size: 1.2em; margin-bottom: 25px; line-height: 1.6; color: #2c3e50; font-weight: bold; }
        .options { display: grid; gap: 15px; }
        .btn { padding: 15px; font-size: 1.1em; border: 2px solid #bdc3c7; border-radius: 10px; background: white; cursor: pointer; transition: all 0.2s; text-align: left; }
        .btn:hover { background-color: #ecf0f1; border-color: #3498db; }
        .btn.correct { background-color: #d4edda; border-color: #28a745; color: #155724; }
        .btn.wrong { background-color: #f8d7da; border-color: #dc3545; color: #721c24; }
        .feedback { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; background-color: #e8f4fd; border-left: 5px solid #3498db; }
        .next-btn { display: none; width: 100%; padding: 15px; margin-top: 20px; background-color: #3498db; color: white; border: none; border-radius: 8px; font-size: 1.2em; cursor: pointer; }
        .result-screen { text-align: center; display: none; }
        .score-circle { width: 150px; height: 150px; background: #3498db; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5em; margin: 0 auto 20px; }
    </style>
</head>
<body>

<div class="container" id="quiz-container">
    <h1>📐 114年數學減C大作戰</h1>
    <div class="progress" id="progress">第 1 / 10 題</div>
    
    <div class="question-box" id="question-text">
        題目載入中...
    </div>

    <div class="options" id="options-container">
        </div>

    <div class="feedback" id="feedback-box"></div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">下一題</button>
</div>

<div class="container result-screen" id="result-screen">
    <h1>測驗完成！</h1>
    <div class="score-circle" id="final-score">100</div>
    <p id="comment" style="font-size: 1.5em;"></p>
    <button class="next-btn" style="display:block" onclick="location.reload()">再練習一次</button>
</div>

<script>
    // 題目資料庫
    const questions = [
        {
            q: "算式 \\(5^{8} \\times 5^{4} \\div 5^{6}\\) 之值與下列何者相等？",
            options: ["\\(5^{6}\\)", "\\(5^{2}\\)", "\\(5^{10}\\)", "\\(5^{18}\\)"],
            answer: 0,
            rationale: "底數相同時：相乘指數相加，相除指數相減。<br>計算：8 + 4 - 6 = 6，故答案為 \\(5^6\\)。"
        },
        {
            q: "若將一張正方形色紙沿著對角線對摺後剪下一個圖形，展開後會形成一個線對稱圖形。下列關於「線對稱圖形」的敘述，何者正確？",
            options: ["對稱軸一定只有一條", "沿著對稱軸對摺，兩側的圖形會完全重合", "平行四邊形一定也是線對稱圖形", "對稱軸連接對稱點的線段不會被對稱軸垂直平分"],
            answer: 1,
            rationale: "這是線對稱圖形的定義：沿著對稱軸對摺，左右兩邊會完全重合。"
        },
        {
            q: "走廊擺放盆栽，每盆寬 40 公分，相鄰兩盆間距 50 公分。若擺放 10 盆，總長度是多少？",
            options: ["900 公分", "850 公分", "860 公分", "940 公分"],
            answer: 1,
            rationale: "10 盆盆栽之間有 9 個間隔。<br>總長 = (10 × 40) + (9 × 50) = 400 + 450 = 850。"
        },
        {
            q: "箱中有號碼 1, 2, 3, 4 的球。小明和小華各抽一球（放回），小明號碼「大於」小華的機率是多少？",
            options: ["\\(\\frac{3}{8}\\)", "\\(\\frac{1}{2}\\)", "\\(\\frac{5}{16}\\)", "\\(\\frac{1}{4}\\)"],
            answer: 0,
            rationale: "全部情形 16 種。小明贏的有 (2,1), (3,1), (3,2), (4,1), (4,2), (4,3) 共 6 種。<br>機率 = 6/16 = 3/8。"
        },
        {
            q: "水庫五個月的水位變化：+5, -3, -2, +4, -6。請問最後水位變化為何？",
            options: ["上升 2 公尺", "下降 2 公尺", "上升 20 公尺", "沒有變化"],
            answer: 1,
            rationale: "將數字全部加起來：5 - 3 - 2 + 4 - 6 = -2。<br>負號代表下降。"
        },
        {
            q: "關於一元二次方程式 \\((x-3)^2 = k\\) 的解，下列敘述何者正確？",
            options: ["當 k=5 時，方程式無解", "當 k=0 時，方程式有兩個相異的解", "當 k=-4 時，方程式無解", "無論 k 是多少，方程式都有解"],
            answer: 2,
            rationale: "因為任何數的平方都不可能是負數（在實數系中），所以當 k 為負數時無解。"
        },
        {
            q: "利用乘法公式 \\(a^2 - b^2 = (a+b)(a-b)\\) 計算 \\(199^2 - 99^2\\) 之值？",
            options: ["10000", "29800", "20000", "39600"],
            answer: 1,
            rationale: "\\(199^2 - 99^2 = (199+99)(199-99) = 298 \\times 100 = 29800\\)。"
        },
        {
            q: "買飯糰(35元)和豆漿(15元)共20份，花500元。設飯糰買 \\(x\\) 個，下列方程式何者正確？",
            options: ["\\(35x + 15(20-x) = 500\\)", "\\(35x + 15x = 500\\)", "\\(35(20-x) + 15x = 500\\)", "\\(x + (20-x) = 500\\)"],
            answer: 0,
            rationale: "若飯糰 x 個，豆漿就是 (20-x) 個。<br>總金額 = 飯糰錢 + 豆漿錢。"
        },
        {
            q: "數線上 A(a), B(-2), C(4)。若 B 是 A 與 C 的中點，求 A 點座標 a？",
            options: ["-8", "1", "-6", "2"],
            answer: 0,
            rationale: "B到C距離為 \\(|4 - (-2)| = 6\\)。<br>A在B的另一側，距離也是6。<br>a = -2 - 6 = -8。"
        },
        {
            q: "柳橙原汁與水比例 3:7。若原汁有 210cc，需要多少水？",
            options: ["490 cc", "90 cc", "630 cc", "147 cc"],
            answer: 0,
            rationale: "3 : 7 = 210 : x。<br>因為 210 是 3 的 70 倍，所以 x 也是 7 的 70 倍。<br>7 × 70 = 490。"
        }
    ];

    let currentQ = 0;
    let score = 0;

    function loadQuestion() {
        document.getElementById("progress").innerText = `第 ${currentQ + 1} / ${questions.length} 題`;
        document.getElementById("question-text").innerHTML = questions[currentQ].q;
        document.getElementById("feedback-box").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
        
        const optionsDiv = document.getElementById("options-container");
        optionsDiv.innerHTML = "";
        
        questions[currentQ].options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.innerHTML = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsDiv.appendChild(btn);
        });

        // 重新渲染數學符號
        if (window.MathJax) {
            MathJax.typeset();
        }
    }

    function checkAnswer(selectedIndex, btnElement) {
        // 鎖定所有按鈕
        const allBtns = document.querySelectorAll(".btn");
        allBtns.forEach(b => b.disabled = true);

        const correctIndex = questions[currentQ].answer;
        const feedback = document.getElementById("feedback-box");

        if (selectedIndex === correctIndex) {
            btnElement.classList.add("correct");
            feedback.innerHTML = "✅ <b>答對了！</b><br>" + questions[currentQ].rationale;
            score++;
        } else {
            btnElement.classList.add("wrong");
            // 顯示正確答案
            allBtns[correctIndex].classList.add("correct");
            feedback.innerHTML = "❌ <b>這題有點可惜！</b><br>" + questions[currentQ].rationale;
        }

        feedback.style.display = "block";
        document.getElementById("next-btn").style.display = "block";
        
        if (window.MathJax) {
            MathJax.typeset();
        }
    }

    function nextQuestion() {
        currentQ++;
        if (currentQ < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById("quiz-container").style.display = "none";
        document.getElementById("result-screen").style.display = "block";
        
        const finalScore = score * 10;
        document.getElementById("final-score").innerText = finalScore;
        
        let comment = "";
        if (finalScore === 100) comment = "太強了！完全制霸！🏆";
        else if (finalScore >= 80) comment = "很棒喔！觀念很清楚！👏";
        else if (finalScore >= 60) comment = "不錯，再加油一下就完美了！💪";
        else comment = "沒關係，我們把觀念再複習一次吧！📚";
        
        document.getElementById("comment").innerText = comment;
    }

    // 初始化
    loadQuestion();
</script>

</body>
</html>

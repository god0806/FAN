<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乘法公式三劍客</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
            touch-action: manipulation;
        }

        /* 面積道場：積木拖曳相關樣式 */
        .drag-container {
            position: relative;
            width: 700px; 
            height: 480px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
            margin: 0 auto;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        .drop-zone {
            position: absolute;
            border: 3px dashed #94a3b8;
            background-color: #f1f5f9;
            box-sizing: border-box;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .drop-zone.success {
            border-color: #22c55e;
            background-color: #f0fdf4;
        }
        .math-block {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            user-select: none;
            box-shadow: 2px 4px 6px rgba(0,0,0,0.2);
            transition: box-shadow 0.2s, transform 0.1s;
            border-radius: 4px;
            font-size: 0.95rem; /* 再次縮小中心字體以防與邊界重疊 */
            border: 1px solid rgba(255,255,255,0.4);
        }
        .math-block:active {
            cursor: grabbing;
            box-shadow: 4px 8px 15px rgba(0,0,0,0.3);
        }
        .math-block.snapped {
            box-shadow: none;
            cursor: default;
            transition: top 0.2s, left 0.2s; /* 貼齊平滑過渡 */
        }

        /* 邊長標示 */
        .edge-label {
            position: absolute;
            pointer-events: none;
            font-size: 11px;
            opacity: 0.85; /* 稍微調低透明度降低視覺衝突 */
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: bold;
        }
        .label-t { top: 2px; left: 50%; transform: translateX(-50%); }
        .label-l { left: 2px; top: 50%; transform: translateY(-50%); }
        .label-b { bottom: 2px; left: 50%; transform: translateX(-50%); }
        .label-r { right: 2px; top: 50%; transform: translateY(-50%); }

        /* 拔河動畫相關樣式 */
        .tug-line {
            position: relative;
            height: 12px;
            background: #cbd5e1;
            border-radius: 6px;
            width: 100%;
            margin-top: 40px;
            margin-bottom: 60px;
        }
        .tug-indicator {
            position: absolute;
            top: 50%;
            left: 50%; /* 0的位置 */
            transform: translate(-50%, -50%);
            width: 52px;
            height: 52px;
            background-color: #ef4444;
            border: 4px solid white;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: white;
            font-size: 1.25rem;
            z-index: 10;
        }
        .tug-mark {
            position: absolute;
            top: 20px;
            transform: translateX(-50%);
            font-size: 0.85rem;
            font-weight: 700;
            color: #64748b;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.5); }
            50% { transform: translate(-50%, -40px) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -80px) scale(1); }
        }
        .combat-text {
            position: absolute;
            left: 50%;
            top: 30%;
            font-size: 2.5rem;
            font-weight: 900;
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff;
            pointer-events: none;
            animation: floatUp 1.2s ease-out forwards;
            z-index: 100;
        }

        @keyframes stampDrop {
            0% { opacity: 0; transform: scale(3) rotate(-20deg); }
            50% { opacity: 1; transform: scale(0.9) rotate(15deg); }
            100% { transform: scale(1) rotate(12deg); }
        }
        .stamp-animate {
            animation: stampDrop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .hidden { display: none !important; }
        .tab-btn.active { background-color: #4f46e5; color: white; }
        .sub-tab-btn.active { background-color: #e0e7ff; color: #4338ca; border-color: #6366f1; }

        /* 修復按鈕文字與 KaTeX 公式重疊問題 */
        .sub-tab-btn, .formula-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.35rem;
            line-height: 1.5;
            min-height: 3rem;
        }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col">

    <!-- 頂部導航 -->
    <header class="bg-indigo-700 text-white p-4 shadow-lg flex flex-col md:flex-row justify-between items-center z-20 gap-4">
        <h1 class="text-2xl font-black tracking-wider flex items-center gap-2 text-center">
            ⚔️ 乘法公式三劍客
        </h1>
        <div class="flex flex-wrap justify-center gap-2 bg-indigo-900 p-1 rounded-lg w-full md:w-auto">
            <button onclick="switchMainTab(1)" id="mainTabBtn1" class="tab-btn active px-5 py-2 rounded-md font-bold transition flex-1 md:flex-none">面積道場</button>
            <button onclick="switchMainTab(2)" id="mainTabBtn2" class="tab-btn px-5 py-2 rounded-md font-bold transition hover:bg-indigo-600 flex-1 md:flex-none">極限拔河</button>
        </div>
    </header>

    <!-- 內容區域 -->
    <main class="flex-grow p-4 md:p-6 flex justify-center overflow-auto items-start">
        
        <!-- 分頁一：面積道場 -->
        <section id="tab1" class="w-full max-w-5xl flex flex-col items-center">
            
            <!-- 子選單 -->
            <div class="flex gap-3 mb-6 flex-col md:flex-row flex-wrap justify-center w-full px-2">
                <button onclick="loadPuzzle(1)" id="subTab1" class="sub-tab-btn w-full md:w-auto px-6 py-2 rounded-full font-bold border-2 border-slate-300 text-slate-600 transition hover:bg-slate-100"><span>和之盾</span> <span>$(A+B)^2$</span></button>
                <button onclick="loadPuzzle(2)" id="subTab2" class="sub-tab-btn w-full md:w-auto px-6 py-2 rounded-full font-bold border-2 border-slate-300 text-slate-600 transition hover:bg-slate-100"><span>差之刃</span> <span>$(A-B)^2$</span></button>
                <button onclick="loadPuzzle(3)" id="subTab3" class="sub-tab-btn w-full md:w-auto px-6 py-2 rounded-full font-bold border-2 border-slate-300 text-slate-600 transition hover:bg-slate-100"><span>雙刃戟</span> <span>$(A+B)(A-B)$</span></button>
            </div>
            
            <!-- 動態訊息區 -->
            <div id="puzzleMessage" class="text-lg font-bold text-indigo-700 mb-4 h-8 text-center transition-opacity duration-300">
                <!-- 訊息顯示於此 -->
            </div>
            
            <div class="overflow-x-auto w-full flex justify-center pb-4 relative">
                <!-- 拖曳容器 -->
                <div class="drag-container" id="dragContainer">
                    <div class="drop-zone" id="dropZone"></div>
                    <!-- 積木將由 JS 動態生成 -->
                </div>
            </div>
            
            <div id="areaSuccessMsg" class="mt-4 p-4 bg-green-100 text-green-700 rounded-xl font-bold text-xl opacity-0 transition-opacity duration-500 shadow-md text-center max-w-2xl">
                <!-- 成功訊息 -->
            </div>
        </section>


        <!-- 分頁二：極限拔河對決 -->
        <section id="tab2" class="w-full max-w-4xl hidden flex-col items-center pt-8">
            <div class="w-full bg-white rounded-3xl shadow-xl p-8 relative overflow-hidden border-4 border-indigo-100">
                <div class="flex justify-between items-center mb-10 px-4">
                    <div class="text-center w-1/3">
                        <div class="text-3xl font-black text-blue-600 mb-1">青龍陣營</div>
                        <div class="text-sm font-bold text-slate-500 bg-blue-100 px-3 py-1 rounded-full inline-block">目標：拉至 -10</div>
                    </div>
                    <div class="text-3xl font-black text-gray-300 w-1/3 text-center">VS</div>
                    <div class="text-center w-1/3">
                        <div class="text-3xl font-black text-orange-600 mb-1">白虎陣營</div>
                        <div class="text-sm font-bold text-slate-500 bg-orange-100 px-3 py-1 rounded-full inline-block">起點：0</div>
                    </div>
                </div>

                <!-- 拔河數線 -->
                <div class="px-8 relative" id="tugArena">
                    <div class="tug-line relative shadow-inner">
                        <!-- 動態生成刻度 -->
                        <script>
                            for(let i=-10; i<=10; i+=2){
                                document.write(`<div class="tug-mark" style="left: ${(i+10)*5}%">${i}</div>`);
                            }
                        </script>
                        <div id="tugIndicator" class="tug-indicator">0</div>
                    </div>
                </div>
                
                <!-- 互動控制區 -->
                <div class="mt-12 text-center min-h-[250px] flex flex-col items-center justify-center border-t-2 border-dashed border-gray-200 pt-8">
                    
                    <button id="btnDraw" onclick="drawQuestion()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-black py-4 px-10 rounded-full text-2xl shadow-[0_6px_0_rgb(67,56,202)] active:shadow-[0_0px_0_rgb(67,56,202)] active:translate-y-1 transition-all">
                        ⚔️ 抽取魔物
                    </button>

                    <div id="quizArea" class="hidden w-full flex-col items-center animate-[fadeIn_0.3s]">
                        <div class="bg-slate-800 text-yellow-300 px-8 py-4 rounded-xl text-4xl font-black shadow-inner mb-6 min-w-[300px] text-center tracking-wider math-katex whitespace-nowrap" id="questionDisplay">
                        </div>
                        
                        <p class="text-slate-500 mb-4 font-bold text-lg">選擇剋制魔物的對應劍客（公式）：</p>
                        
                        <div class="flex gap-4 mb-8 flex-col md:flex-row flex-wrap justify-center w-full max-w-4xl px-2">
                            <button onclick="selectFormula(1, this)" class="formula-btn w-full md:flex-1 min-w-[200px] border-2 border-blue-400 text-blue-700 bg-blue-50 font-bold py-3 px-4 rounded-xl hover:bg-blue-100 transition shadow-sm text-lg">
                                <span>🛡️ 和之盾</span> <span>$(A+B)^2$</span>
                            </button>
                            <button onclick="selectFormula(2, this)" class="formula-btn w-full md:flex-1 min-w-[200px] border-2 border-red-400 text-red-700 bg-red-50 font-bold py-3 px-4 rounded-xl hover:bg-red-100 transition shadow-sm text-lg">
                                <span>🗡️ 差之刃</span> <span>$(A-B)^2$</span>
                            </button>
                            <button onclick="selectFormula(3, this)" class="formula-btn w-full md:flex-1 min-w-[200px] border-2 border-purple-400 text-purple-700 bg-purple-50 font-bold py-3 px-4 rounded-xl hover:bg-purple-100 transition shadow-sm text-lg">
                                <span>🔱 雙刃戟</span> <span>$(A+B)(A-B)$</span>
                            </button>
                        </div>

                        <div id="answerArea" class="hidden flex gap-3 flex-col sm:flex-row items-center">
                            <input type="text" id="inputAnswer" placeholder="輸入計算結果..." class="border-2 border-slate-300 rounded-xl px-5 py-3 text-2xl font-bold w-full sm:w-64 text-center focus:outline-none focus:border-indigo-500 shadow-inner">
                            <button onclick="submitAnswer()" class="bg-green-500 hover:bg-green-400 text-white font-black py-3 px-8 rounded-xl shadow-[0_5px_0_rgb(21,128,61)] active:translate-y-1 active:shadow-none transition-all text-xl w-full sm:w-auto">
                                發動攻擊
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 訊息對話框 -->
    <div id="modalOverlay" class="fixed inset-0 bg-slate-900 bg-opacity-60 hidden flex items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full mx-4 shadow-2xl text-center transform scale-95 transition-transform duration-200" id="modalBox">
            <h3 id="modalTitle" class="text-3xl font-black mb-3">標題</h3>
            <p id="modalMsg" class="text-lg text-slate-600 mb-8 font-bold leading-relaxed whitespace-pre-line">訊息內容</p>
            <button onclick="closeModal()" class="bg-indigo-600 text-white font-bold py-3 px-10 rounded-full hover:bg-indigo-500 w-full text-xl shadow-lg">確認</button>
        </div>
    </div>

    <!-- 勝利畫面 -->
    <div id="victoryOverlay" class="fixed inset-0 bg-slate-900 bg-opacity-95 hidden flex flex-col items-center justify-center z-50">
        <h2 class="text-5xl md:text-7xl font-black text-yellow-400 mb-6 animate-bounce text-center drop-shadow-lg">青龍陣營獲勝！</h2>
        <p class="text-2xl text-slate-300 mb-12 font-bold tracking-widest">極限拔河完全壓制</p>
        
        <!-- 睿帆認證 SVG 印章 -->
        <div class="relative w-56 h-56 stamp-animate mb-12">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- 外框與內框 -->
                <circle cx="50" cy="50" r="46" fill="none" stroke="#dc2626" stroke-width="4"/>
                <circle cx="50" cy="50" r="40" fill="none" stroke="#dc2626" stroke-width="2"/>
                <!-- 文字 -->
                <text x="50" y="42" font-family="'Noto Sans TC', sans-serif" font-weight="900" font-size="22" fill="#dc2626" text-anchor="middle">睿帆</text>
                <text x="50" y="72" font-family="'Noto Sans TC', sans-serif" font-weight="900" font-size="22" fill="#dc2626" text-anchor="middle">認證</text>
                <!-- 裝飾線 -->
                <line x1="20" y1="50" x2="80" y2="50" stroke="#dc2626" stroke-width="1.5" />
                <!-- 磨損效果 (斑駁) -->
                <path d="M 10,20 Q 30,30 20,50 T 10,80 M 90,20 Q 70,30 80,50 T 90,80" stroke="#0f172a" stroke-width="4" opacity="0.4" stroke-dasharray="2 6" fill="none"/>
            </svg>
        </div>
        
        <button onclick="resetGame()" class="bg-white text-slate-900 font-black py-4 px-10 rounded-full hover:bg-gray-200 transition text-2xl shadow-[0_0_20px_rgba(255,255,255,0.3)]">
            重新挑戰
        </button>
    </div>

    <script>
        // ==========================================
        // 核心渲染與切換邏輯
        // ==========================================
        function renderMath(element = document.body) {
            if (window.renderMathInElement) {
                renderMathInElement(element, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        function switchMainTab(tabNum) {
            document.getElementById('tab1').classList.add('hidden');
            document.getElementById('tab2').classList.add('hidden');
            document.getElementById('mainTabBtn1').classList.remove('active', 'bg-indigo-600');
            document.getElementById('mainTabBtn2').classList.remove('active', 'bg-indigo-600');
            
            document.getElementById(`tab${tabNum}`).classList.remove('hidden');
            document.getElementById(`mainTabBtn${tabNum}`).classList.add('active');
            
            if(tabNum === 1) loadPuzzle(1);
        }

        // ==========================================
        // 模組一：面積道場 (資料驅動拖曳)
        // ==========================================
        const puzzles = {
            1: {
                title: "請將積木拼入虛線框，證明和之盾",
                msg: "🎉 完美契合！你成功證明了 $(A+B)^2 = A^2 + 2AB + B^2$",
                dropZone: { w: 240, h: 240, x: 380, y: 100 },
                pieces: [
                    { id: 'p1_a2', w: 160, h: 160, x: 40, y: 40, tx: 0, ty: 0, z: 10, class: 'bg-blue-500 text-white', label: '$A^2$', edges: {t: 'A', l: 'A'} },
                    { id: 'p1_b2', w: 80, h: 80, x: 220, y: 40, tx: 160, ty: 160, z: 10, class: 'bg-orange-500 text-white', label: '$B^2$', edges: {t: 'B', l: 'B'} },
                    { id: 'p1_ab1', w: 80, h: 160, x: 40, y: 220, tx: 160, ty: 0, z: 10, class: 'bg-green-500 text-white', label: '$AB$', edges: {t: 'B', l: 'A'} },
                    { id: 'p1_ab2', w: 160, h: 80, x: 140, y: 220, tx: 0, ty: 160, z: 10, class: 'bg-green-500 text-white', label: '$AB$', edges: {t: 'A', l: 'B'} }
                ]
            },
            2: {
                title: "請依序將積木疊合在虛線框，證明差之刃",
                msg: "🎉 重疊處被扣了兩次，補回 $B^2$ 後，剩下的純藍色區域即為 $(A-B)^2$",
                dropZone: { w: 200, h: 200, x: 380, y: 120 },
                pieces: [
                    { id: 'p2_a2', w: 200, h: 200, x: 40, y: 40, tx: 0, ty: 0, z: 1, class: 'bg-blue-500 text-white', label: '$A^2$', edges: {t: 'A', l: 'A'} },
                    { id: 'p2_ab1', w: 200, h: 80, x: 40, y: 260, tx: 0, ty: 120, z: 2, class: 'bg-red-500 bg-opacity-70 border-2 border-red-700 text-white', label: '$-AB$', edges: {t: 'A', l: 'B'} },
                    { id: 'p2_ab2', w: 80, h: 200, x: 260, y: 40, tx: 120, ty: 0, z: 3, class: 'bg-red-500 bg-opacity-70 border-2 border-red-700 text-white', label: '$-AB$', edges: {t: 'B', l: 'A'} },
                    { id: 'p2_b2', w: 80, h: 80, x: 260, y: 260, tx: 120, ty: 120, z: 4, class: 'bg-yellow-400 text-slate-800 font-black', label: '$+B^2$', edges: {t: 'B', l: 'B'} }
                ]
            },
            3: {
                title: "請將兩塊積木重組成一個大長方形，證明雙刃戟",
                msg: "🎉 成功組合！$A^2 - B^2$ 被重新拼成寬 $(A+B)$ 高 $(A-B)$ 的長方形",
                dropZone: { w: 350, h: 140, x: 330, y: 150 },
                pieces: [
                    { id: 'p3_p1', w: 200, h: 140, x: 40, y: 50, tx: 0, ty: 0, z: 10, class: 'bg-blue-500 text-white', label: '$A(A-B)$', edges: {t: 'A', l: 'A-B'} },
                    { id: 'p3_p2', w: 150, h: 140, x: 40, y: 220, tx: 200, ty: 0, z: 10, class: 'bg-orange-500 text-white', label: '$B(A-B)$', edges: {t: 'B', l: 'A-B'} }
                ]
            }
        };

        let currentPuzzleId = null;
        let draggedEl = null;
        let startPosX = 0, startPosY = 0;
        let blocksSnapped = 0;

        function loadPuzzle(id) {
            currentPuzzleId = id;
            const p = puzzles[id];
            
            // 更新 UI 狀態
            document.querySelectorAll('.sub-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`subTab${id}`).classList.add('active');
            
            document.getElementById('puzzleMessage').textContent = p.title;
            const successMsg = document.getElementById('areaSuccessMsg');
            successMsg.classList.add('opacity-0');
            successMsg.classList.remove('opacity-100');
            successMsg.innerHTML = p.msg; // 將在完成時渲染 KaTeX

            const container = document.getElementById('dragContainer');
            const dropZone = document.getElementById('dropZone');
            
            // 清理現有積木
            document.querySelectorAll('.math-block').forEach(el => el.remove());
            blocksSnapped = 0;
            
            // 設定 Drop Zone
            dropZone.style.width = p.dropZone.w + 'px';
            dropZone.style.height = p.dropZone.h + 'px';
            dropZone.style.left = p.dropZone.x + 'px';
            dropZone.style.top = p.dropZone.y + 'px';
            dropZone.classList.remove('success');

            // 產生積木
            p.pieces.forEach(piece => {
                const el = document.createElement('div');
                el.className = `math-block whitespace-nowrap ${piece.class}`;
                el.id = piece.id;
                el.style.width = piece.w + 'px';
                el.style.height = piece.h + 'px';
                el.style.left = piece.x + 'px';
                el.style.top = piece.y + 'px';
                el.style.zIndex = piece.z;
                
                let innerHTML = `<span class="relative z-10 font-bold drop-shadow-md pointer-events-none px-8">${piece.label}</span>`;
                if (piece.edges) {
                    if (piece.edges.t) innerHTML += `<div class="edge-label label-t">$${piece.edges.t}$</div>`;
                    if (piece.edges.l) innerHTML += `<div class="edge-label label-l">$${piece.edges.l}$</div>`;
                    if (piece.edges.b) innerHTML += `<div class="edge-label label-b">$${piece.edges.b}$</div>`;
                    if (piece.edges.r) innerHTML += `<div class="edge-label label-r">$${piece.edges.r}$</div>`;
                }
                el.innerHTML = innerHTML;
                
                // 儲存目標全局座標
                el.dataset.targetX = piece.tx + p.dropZone.x;
                el.dataset.targetY = piece.ty + p.dropZone.y;
                el.dataset.baseZ = piece.z; // 記住基礎 z-index 以利還原
                
                // 綁定事件
                el.addEventListener('mousedown', dragStart);
                el.addEventListener('touchstart', dragStart, {passive: false});
                
                container.appendChild(el);
            });
            renderMath(document.getElementById('tab1'));
        }

        // 拖曳控制
        function dragStart(e) {
            if(e.target.classList.contains('snapped')) return;
            e.preventDefault();
            draggedEl = e.target;
            draggedEl.style.zIndex = "100"; // 拖曳時置頂
            
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            startPosX = clientX - draggedEl.offsetLeft;
            startPosY = clientY - draggedEl.offsetTop;

            document.addEventListener('mousemove', dragMove);
            document.addEventListener('mouseup', dragEnd);
            document.addEventListener('touchmove', dragMove, {passive: false});
            document.addEventListener('touchend', dragEnd);
        }

        function dragMove(e) {
            if (!draggedEl) return;
            e.preventDefault();
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            const container = document.getElementById('dragContainer');
            let newLeft = clientX - startPosX;
            let newTop = clientY - startPosY;
            
            // 邊界限制
            newLeft = Math.max(0, Math.min(newLeft, container.offsetWidth - draggedEl.offsetWidth));
            newTop = Math.max(0, Math.min(newTop, container.offsetHeight - draggedEl.offsetHeight));

            draggedEl.style.left = newLeft + 'px';
            draggedEl.style.top = newTop + 'px';
        }

        function dragEnd(e) {
            if (!draggedEl) return;
            
            const currentX = parseInt(draggedEl.style.left);
            const currentY = parseInt(draggedEl.style.top);
            const targetX = parseInt(draggedEl.dataset.targetX);
            const targetY = parseInt(draggedEl.dataset.targetY);

            // 判斷吸附 (距離 < 20px)
            const dist = Math.sqrt(Math.pow(currentX - targetX, 2) + Math.pow(currentY - targetY, 2));
            
            if (dist < 20) {
                draggedEl.style.left = targetX + 'px';
                draggedEl.style.top = targetY + 'px';
                draggedEl.classList.add('snapped');
                draggedEl.style.zIndex = draggedEl.dataset.baseZ; // 恢復預設圖層順序
                blocksSnapped++;
                checkPuzzleWin();
            } else {
                draggedEl.style.zIndex = draggedEl.dataset.baseZ;
            }

            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('mouseup', dragEnd);
            document.removeEventListener('touchmove', dragMove);
            document.removeEventListener('touchend', dragEnd);
            draggedEl = null;
        }

        function checkPuzzleWin() {
            const totalPieces = puzzles[currentPuzzleId].pieces.length;
            if(blocksSnapped === totalPieces) {
                setTimeout(() => {
                    const msgEl = document.getElementById('areaSuccessMsg');
                    msgEl.classList.remove('opacity-0');
                    msgEl.classList.add('opacity-100');
                    document.getElementById('dropZone').classList.add('success');
                    renderMath(msgEl); // 渲染成功訊息內的 KaTeX
                }, 300);
            }
        }


        // ==========================================
        // 模組二：極限拔河對決 (遊戲邏輯)
        // ==========================================
        const qBank = [
            { q: "103^2", t: 1, ans: "10609" },
            { q: "98^2", t: 2, ans: "9604" },
            { q: "52 \\times 48", t: 3, ans: "2496" },
            { q: "(3x+5)^2", t: 1, ans: "9x^2+30x+25" },
            { q: "105^2", t: 1, ans: "11025" },
            { q: "199^2", t: 2, ans: "39601" },
            { q: "201 \\times 199", t: 3, ans: "39999" }
        ];

        let tugPos = 0;
        let activeQ = null;
        let activeFormula = null;

        function drawQuestion() {
            const rand = Math.floor(Math.random() * qBank.length);
            activeQ = qBank[rand];
            
            document.getElementById('btnDraw').classList.add('hidden');
            document.getElementById('quizArea').classList.remove('hidden');
            
            const qDisp = document.getElementById('questionDisplay');
            qDisp.innerHTML = '$' + activeQ.q + '$';
            qDisp.removeAttribute('data-tex');
            renderMath(qDisp);
        }

        function selectFormula(type, btnEl) {
            activeFormula = type;
            document.querySelectorAll('.formula-btn').forEach(btn => {
                btn.classList.remove('ring-4', 'ring-indigo-500', 'scale-105');
            });
            btnEl.classList.add('ring-4', 'ring-indigo-500', 'scale-105');
            
            document.getElementById('answerArea').classList.remove('hidden');
            document.getElementById('inputAnswer').focus();
        }

        // 清除答案中的空格以增加寬容度
        function cleanAns(str) {
            return str.replace(/\s+/g, '').toLowerCase();
        }

        function submitAnswer() {
            const userAns = document.getElementById('inputAnswer').value.trim();
            if(!userAns) return showModal("錯誤", "請先輸入計算結果！");

            const isAnsCorrect = (cleanAns(userAns) === cleanAns(activeQ.ans));
            const isFormulaCorrect = (activeFormula === activeQ.t);
            
            let move = 0;
            if(isAnsCorrect && isFormulaCorrect) {
                move = -2;
                showCombatText("⚔️ 完全擊殺 -2", "text-red-500");
                showModal("太神啦！", `選對公式且計算正確！\n答案為 ${activeQ.ans}，移動 2 格！`, "text-red-600");
            } else if (isAnsCorrect && !isFormulaCorrect) {
                move = -1;
                showCombatText("🔪 擦傷 -1", "text-yellow-500");
                showModal("擦傷！", `雖然算對了，但選錯劍客囉！\n只能發揮一半威力，移動 1 格。`, "text-yellow-600");
            } else {
                showCombatText("💨 揮空", "text-slate-500");
                showModal("揮空！", `計算錯誤。正確答案為 ${activeQ.ans}。\n請再接再厲！`, "text-slate-600");
            }

            tugPos += move;
            if(tugPos < -10) tugPos = -10;
            
            updateTugLine();
            resetQuiz();
        }

        function updateTugLine() {
            const indicator = document.getElementById('tugIndicator');
            const pct = 50 + (tugPos * 5); // -10=0%, 0=50%, 10=100%
            indicator.style.left = `${pct}%`;
            indicator.textContent = tugPos;
            
            if(tugPos < 0) indicator.style.backgroundColor = '#2563eb';
            else if(tugPos > 0) indicator.style.backgroundColor = '#ea580c';
            else indicator.style.backgroundColor = '#ef4444';
        }

        function resetQuiz() {
            document.getElementById('btnDraw').classList.remove('hidden');
            document.getElementById('quizArea').classList.add('hidden');
            document.getElementById('answerArea').classList.add('hidden');
            document.getElementById('inputAnswer').value = '';
            activeFormula = null;
            document.querySelectorAll('.formula-btn').forEach(btn => {
                btn.classList.remove('ring-4', 'ring-indigo-500', 'scale-105');
            });
        }

        function resetGame() {
            tugPos = 0;
            updateTugLine();
            document.getElementById('victoryOverlay').classList.add('hidden');
            resetQuiz();
        }

        // ==========================================
        // 共用工具 (Modal & FX)
        // ==========================================
        function showModal(title, msg, color = "text-slate-800") {
            const overlay = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalTitle').className = `text-3xl font-black mb-3 ${color}`;
            document.getElementById('modalMsg').textContent = msg;
            
            overlay.classList.remove('hidden');
            setTimeout(() => box.classList.remove('scale-95'), 10);
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            const box = document.getElementById('modalBox');
            box.classList.add('scale-95');
            setTimeout(() => overlay.classList.add('hidden'), 200);
            
            if(tugPos <= -10) {
                document.getElementById('victoryOverlay').classList.remove('hidden');
            }
        }

        function showCombatText(text, color) {
            const arena = document.getElementById('tugArena');
            const el = document.createElement('div');
            el.className = `combat-text ${color}`;
            el.textContent = text;
            arena.appendChild(el);
            setTimeout(() => { if(el.parentNode) el.parentNode.removeChild(el); }, 1200);
        }

        // 初始化
        window.onload = () => {
            renderMath();
            loadPuzzle(1); // 預設載入拼圖1
        };
    </script>
</body>
</html>

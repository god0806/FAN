<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恩賜評量與線上分析系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .radio-btn-group input:checked + div {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
        
        .radio-btn-group input:focus + div {
            box-shadow: 0 0 0 2px #93c5fd;
        }

        .bar-fill {
            transition: width 1s ease-out;
        }

        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="antialiased min-h-screen pb-20">

    <!-- 標題與介紹區 -->
    <header class="bg-blue-600 text-white py-12 px-4 shadow-md">
        <div class="max-w-4xl mx-auto text-center">
            <h1 class="text-3xl md:text-5xl font-bold mb-4">恩賜評量與線上分析系統</h1>
            <p class="text-lg md:text-xl text-blue-100 mb-6">發掘神賜給你的獨特禮物與呼召</p>
            
            <div class="bg-blue-700/50 rounded-xl p-6 text-left inline-block max-w-2xl mx-auto shadow-inner">
                <h2 class="text-xl font-semibold mb-3 border-b border-blue-400 pb-2">填寫說明</h2>
                <p class="mb-4 text-blue-50">請依據您的「實際情況」作答，而非期望達到的程度。對每一道題目，請選擇最符合您狀況的分數：</p>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center font-medium">
                    <div class="bg-white/10 p-2 rounded-lg"><span class="text-2xl font-bold block mb-1">4</span>確實如此</div>
                    <div class="bg-white/10 p-2 rounded-lg"><span class="text-2xl font-bold block mb-1">2</span>常常如此</div>
                    <div class="bg-white/10 p-2 rounded-lg"><span class="text-2xl font-bold block mb-1">1</span>偶爾如此</div>
                    <div class="bg-white/10 p-2 rounded-lg"><span class="text-2xl font-bold block mb-1">0</span>從未如此</div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-8 relative">
        
        <!-- 表單區 -->
        <section id="form-section" class="bg-white rounded-2xl shadow-lg p-6 md:p-8">
            <form id="assessment-form">
                <div id="questions-container" class="space-y-6">
                    <!-- 動態生成題目 -->
                </div>

                <!-- 底部懸浮按鈕區 -->
                <div class="sticky bottom-4 mt-12 bg-white/90 backdrop-blur-sm p-4 rounded-xl border border-gray-200 shadow-xl flex justify-center z-10">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg py-3 px-12 rounded-full transition-all transform hover:scale-105 shadow-md flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                        </svg>
                        計算與分析結果
                    </button>
                </div>
            </form>
        </section>

        <!-- 結果分析區 -->
        <section id="results-section" class="hidden animate-fade-in-up">
            <div class="text-center mb-8">
                <h2 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">您的專屬恩賜分析</h2>
                <p class="text-gray-600">根據您的填寫，以下是系統為您整理出的恩賜傾向。</p>
            </div>

            <!-- Top 3 卡片 -->
            <h3 class="text-2xl font-bold text-blue-700 mb-6 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-yellow-500" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M5 2a1 1 0 011 1v1h1a1 1 0 010 2H6v1a1 1 0 01-2 0V6H3a1 1 0 010-2h1V3a1 1 0 011-1zm0 10a1 1 0 011 1v1h1a1 1 0 110 2H6v1a1 1 0 11-2 0v-1H3a1 1 0 110-2h1v-1a1 1 0 011-1zM12 2a1 1 0 01.967.744L14.146 7.2 17.5 9.134a1 1 0 010 1.732l-3.354 1.935-1.18 4.455a1 1 0 01-1.933 0L9.854 12.8 6.5 10.866a1 1 0 010-1.732l3.354-1.935 1.18-4.455A1 1 0 0112 2z" clip-rule="evenodd" />
                </svg>

            </h3>
            <div id="top-3-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                <!-- 動態插入 Top 3 -->
            </div>

            <!-- 所有恩賜長條圖 -->
            <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8">
                <h3 class="text-2xl font-bold text-gray-800 mb-6">各項恩賜得分總覽</h3>
                <div class="text-sm text-gray-500 mb-4">* 滿分為 20 分 (5題 × 4分)</div>
                <div id="all-scores-container" class="space-y-4">
                    <!-- 動態插入長條圖 -->
                </div>
                
                <div class="mt-12 text-center border-t pt-8">
                    <button id="btn-retake" class="text-blue-600 border border-blue-600 hover:bg-blue-50 font-bold py-2 px-8 rounded-full transition-colors">
                        重新測驗
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- 自訂訊息框 (取代 Alert) -->
    <div id="custom-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-xl shadow-2xl p-8 max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300 relative">
            <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />

            <button id="btn-close-modal" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition-colors">
                我知道了，返回檢查
            </button>
        </div>
    </div>

                                <label class="cursor-pointer flex-1 md:flex-none">
                                    <input type="radio" name="q${qNum}" value="${val}" class="peer sr-only" required>
                                    <div class="px-3 py-2 text-center border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors">
                                        ${val}
                                    </div>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        });

        // 彈出視窗控制
        const modal = document.getElementById('custom-modal');
        const btnCloseModal = document.getElementById('btn-close-modal');

        function showModal(msg) {
            document.getElementById('modal-message').innerText = msg;
            modal.classList.remove('hidden');
            // 延遲以達成淡入動畫
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.children[0].classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modal.children[0].classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        btnCloseModal.addEventListener('click', closeModal);

        // 表單提交與計算邏輯
        document.getElementById('assessment-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 驗證是否填妥
            const formData = new FormData(this);
            let unAnswered = [];
            for (let i = 1; i <= 115; i++) {
                if (!formData.has('q' + i)) {
                    unAnswered.push(i);
                }
            }

            if (unAnswered.length > 0) {
                // 滾動到第一個未填寫的題目
                const firstMissed = document.querySelector(`input[name="q${unAnswered[0]}"]`).closest('div.p-4');
                firstMissed.scrollIntoView({ behavior: 'smooth', block: 'center' });
                firstMissed.classList.add('border-red-400', 'bg-red-50');
                setTimeout(() => firstMissed.classList.remove('border-red-400', 'bg-red-50'), 2000);
                
                showModal(`您還有 ${unAnswered.length} 題尚未作答（例如第 ${unAnswered[0]} 題），請全部填寫完畢。`);
                return;
            }

            // 計算分數
            let results = categories.map(cat => {
                let score = 0;
                cat.qs.forEach(qId => {
                    score += parseInt(formData.get('q' + qId) || 0);
                });
                return { ...cat, score };
            });

            // 排序 (分數由高到低)
            results.sort((a, b) => b.score - a.score);

            renderResults(results);
        });

        // 渲染結果畫面
        function renderResults(results) {
            const formSection = document.getElementById('form-section');
            const resultsSection = document.getElementById('results-section');
            const top3Container = document.getElementById('top-3-container');
            const allScoresContainer = document.getElementById('all-scores-container');

            // 渲染 Top 3
            top3Container.innerHTML = '';
            const colors = ['bg-yellow-50 border-yellow-200 text-yellow-800', 'bg-gray-50 border-gray-200 text-gray-800', 'bg-orange-50 border-orange-200 text-orange-800'];
            const medals = ['🥇 第一名', '🥈 第二名', '🥉 第三名'];

            for (let i = 0; i < 3; i++) {
                if(results[i]) {
                    const item = results[i];
                    top3Container.innerHTML += `
                        <div class="rounded-2xl border-2 ${colors[i]} p-6 shadow-sm relative overflow-hidden transform hover:-translate-y-1 transition duration-300">
                            <div class="text-sm font-bold mb-2 opacity-80">${medals[i]}</div>
                            <div class="flex justify-between items-end mb-4 border-b border-current pb-3">
                                <h4 class="text-3xl font-extrabold tracking-tight">${item.name}</h4>
                                <div class="text-2xl font-black">${item.score} <span class="text-sm font-normal">分</span></div>
                            </div>
                            <div class="space-y-3 text-sm">
                                <div><strong class="block mb-1 opacity-90">✨ 特質：</strong> ${item.trait}</div>
                                <div><strong class="block mb-1 opacity-90">💡 建議服事：</strong> ${item.suggest}</div>
                            </div>
                        </div>
                    `;
                }
            }

            // 渲染全部分數長條圖
            allScoresContainer.innerHTML = '';
            const maxScore = 20; // 5題 * 4分 = 20分
            
            results.forEach((item, index) => {
                const widthPercent = (item.score / maxScore) * 100;
                // 用不同深淺的藍色凸顯前段班
                const barColor = index < 3 ? 'bg-blue-500' : 'bg-blue-300';
                
                allScoresContainer.innerHTML += `
                    <div class="flex items-center gap-4 group">
                        <div class="w-24 text-right font-medium text-gray-700 truncate">${item.name}</div>
                        <div class="flex-1 h-6 bg-gray-100 rounded-full overflow-hidden relative">
                            <div class="${barColor} h-full rounded-full bar-fill flex items-center justify-end px-2" style="width: 0%;" data-width="${widthPercent}%">
                                ${widthPercent > 10 ? `<span class="text-xs text-white font-bold">${item.score}</span>` : ''}
                            </div>
                        </div>
                        <div class="w-8 text-sm font-bold text-gray-500">${item.score}</div>
                    </div>
                `;
            });

            // 切換視圖
            formSection.classList.add('hidden');
            resultsSection.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // 觸發長條圖動畫
            setTimeout(() => {
                document.querySelectorAll('.bar-fill').forEach(bar => {
                    bar.style.width = bar.getAttribute('data-width');
                });
            }, 100);
        }

        // 重新測驗
        document.getElementById('btn-retake').addEventListener('click', () => {
            document.getElementById('assessment-form').reset();
            document.getElementById('results-section').classList.add('hidden');
            document.getElementById('form-section').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>
</html>
